<text x="445.0" y="125" text-anchor="middle" font-family="Liberation Sans" font-size="8.8" font-weight="bold" fill="#1E293B">Flujo 1: Marcación Biométrica y Resiliencia Offline (EDU-0003 / RNF-0012)</text>
